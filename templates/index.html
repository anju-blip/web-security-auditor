<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Security Auditor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1528 100%);
            color: #e0e7ff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: #8892b0; font-size: 1.1rem; margin-top: 10px; }
        .scan-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .url-input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .url-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        .btn-primary {
            padding: 14px 32px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .scan-options {
            display: flex;
            gap: 25px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8892b0;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }
        .checkbox-label input[type="checkbox"]:checked {
            background: #00d4ff;
            border-color: #00d4ff;
        }
        .checkbox-label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
        }
        .batch-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }
        .batch-section textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .batch-section textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .btn-secondary {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e7ff;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .summary-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .summary-card .label {
            color: #8892b0;
            font-size: 0.9rem;
        }
        .risk-critical .number { color: #ff4757; }
        .risk-high .number { color: #ff6b6b; }
        .risk-medium .number { color: #ffa502; }
        .risk-low .number { color: #2ed573; }
        .detailed-results {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
        }
        .result-section { margin-bottom: 25px; }
        .result-section h3 {
            color: #00d4ff;
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .result-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 4px solid;
        }
        .result-item .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .result-item .item-name { font-weight: 600; }
        .severity {
            font-size: 0.8rem;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }
        .severity-CRITICAL { background: #ff4757; color: #fff; }
        .severity-HIGH { background: #ff6b6b; color: #fff; }
        .severity-MEDIUM { background: #ffa502; color: #fff; }
        .severity-LOW { background: #2ed573; color: #fff; }
        .result-item .description { color: #8892b0; font-size: 0.9rem; }
        .result-item .recommendation {
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 6px;
            font-size: 0.9rem;
            color: #00d4ff;
        }
        .passed-header { border-left-color: #2ed573; }
        .passed-header .item-name { color: #2ed573; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .input-group { flex-direction: column; }
            .scan-options { flex-direction: column; gap: 10px; }
            .summary-cards { grid-template-columns: repeat(2, 1fr); }
        }
        .loading-text { color: #00d4ff; }
        .error-message { color: #ff4757; }
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .status-error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }
        .status-success {
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.2);
            color: #2ed573;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web Security Auditor</h1>
            <p class="subtitle">Lightweight Passive Security and Header Scanner</p>
        </header>

        <main>
            <div class="scan-section">
                <div class="input-group">
                    <input type="text" id="targetUrl" placeholder="Enter URL (e.g., https://example.com)" class="url-input">
                    <button id="scanBtn" class="btn-primary">
                        <span class="btn-text">Scan Now</span>
                        <span class="spinner" style="display: none;"></span>
                    </button>
                </div>
                <div class="scan-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="batchMode">
                        Batch Scan
                    </label>
                </div>
            </div>

            <div id="batchInput" class="batch-section">
                <textarea id="batchUrls" rows="4" placeholder="Enter multiple URLs (one per line)&#10;https://example1.com&#10;https://example2.com"></textarea>
                <button id="batchScanBtn" class="btn-secondary">Scan All</button>
            </div>

            <div id="statusMessage" style="display: none;"></div>
            <div id="results" style="display: none;">
                <div class="summary-cards" id="summaryCards"></div>
                <div class="detailed-results" id="detailedResults"></div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const targetUrl = document.getElementById('targetUrl');
            const scanBtn = document.getElementById('scanBtn');
            const batchMode = document.getElementById('batchMode');
            const batchInput = document.getElementById('batchInput');
            const batchUrls = document.getElementById('batchUrls');
            const batchScanBtn = document.getElementById('batchScanBtn');
            const results = document.getElementById('results');
            const summaryCards = document.getElementById('summaryCards');
            const detailedResults = document.getElementById('detailedResults');
            const statusMessage = document.getElementById('statusMessage');

            // Toggle batch input
            batchMode.addEventListener('change', function() {
                batchInput.style.display = this.checked ? 'block' : 'none';
            });

            // Single URL scan
            scanBtn.addEventListener('click', function() {
                const url = targetUrl.value.trim();
                if (!url) {
                    showStatus('Please enter a URL', 'error');
                    return;
                }
                performScan(url);
            });

            // Batch scan
            batchScanBtn.addEventListener('click', function() {
                const urls = batchUrls.value.split('\n')
                    .map(u => u.trim())
                    .filter(u => u);
                if (urls.length === 0) {
                    showStatus('Please enter at least one URL', 'error');
                    return;
                }
                performBatchScan(urls);
            });

            // Enter key support
            targetUrl.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    scanBtn.click();
                }
            });

            async function performScan(url) {
                showLoading(true);
                results.style.display = 'none';
                hideStatus();

                try {
                    const response = await fetch('/api/scan', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ url: url })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    showLoading(false);
                    
                    if (data.error) {
                        showStatus('Error: ' + data.error, 'error');
                    } else {
                        displayResults(data);
                    }
                } catch (error) {
                    showLoading(false);
                    showStatus('Failed to connect to server. Make sure Flask is running on port 5000. Error: ' + error.message, 'error');
                    console.error('Fetch error:', error);
                }
            }

            async function performBatchScan(urls) {
                showLoading(true);
                results.style.display = 'none';
                hideStatus();

                try {
                    const response = await fetch('/api/batch-scan', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ urls: urls })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    showLoading(false);
                    displayBatchResults(data);
                } catch (error) {
                    showLoading(false);
                    showStatus('Failed to connect to server. Make sure Flask is running on port 5000. Error: ' + error.message, 'error');
                    console.error('Fetch error:', error);
                }
            }

            function displayResults(report) {
                results.style.display = 'block';
                hideStatus();
                
                if (report.error) {
                    showStatus('Error: ' + report.error, 'error');
                    return;
                }

                const summary = report.scan_summary || {};
                const riskLevel = summary.risk_level || 'LOW';
                
                summaryCards.innerHTML = `
                    <div class="summary-card risk-${riskLevel.toLowerCase()}">
                        <div class="number">${summary.missing_headers || 0}</div>
                        <div class="label">Missing Headers</div>
                    </div>
                    <div class="summary-card">
                        <div class="number">${summary.disclosures_found || 0}</div>
                        <div class="label">Info Disclosures</div>
                    </div>
                    <div class="summary-card">
                        <div class="number">${summary.cookie_issues || 0}</div>
                        <div class="label">Cookie Issues</div>
                    </div>
                    <div class="summary-card">
                        <div class="number">${report.status_code || 'N/A'}</div>
                        <div class="label">HTTP Status</div>
                    </div>
                    <div class="summary-card">
                        <div class="number">${summary.headers_present || 0}/${summary.total_headers_checked || 0}</div>
                        <div class="label">Headers Present</div>
                    </div>
                    <div class="summary-card risk-${riskLevel.toLowerCase()}">
                        <div class="number">${riskLevel}</div>
                        <div class="label">Risk Level</div>
                    </div>
                `;

                let html = `
                    <div class="result-section">
                        <h3>Security Headers</h3>
                `;

                if (report.findings && report.findings.length > 0) {
                    report.findings.forEach(f => {
                        html += `
                            <div class="result-item">
                                <div class="item-header">
                                    <span class="item-name">[X] ${f.item}</span>
                                    <span class="severity severity-${f.severity}">${f.severity}</span>
                                </div>
                                <div class="description">${f.description}</div>
                                ${f.recommendation ? `<div class="recommendation">[i] ${f.recommendation}</div>` : ''}
                            </div>
                        `;
                    });
                }

                if (report.passed_checks && report.passed_checks.length > 0) {
                    report.passed_checks.forEach(p => {
                        html += `
                            <div class="result-item passed-header">
                                <div class="item-header">
                                    <span class="item-name">[✓] ${p.header}</span>
                                    <span style="color: #2ed573; font-size: 0.8rem;">Present</span>
                                </div>
                                <div class="description">Value: ${p.value}</div>
                            </div>
                        `;
                    });
                }
                html += '</div>';

                if (report.cookie_issues && report.cookie_issues.length > 0) {
                    html += `
                        <div class="result-section">
                            <h3>Cookie Security Issues</h3>
                    `;
                    report.cookie_issues.forEach(c => {
                        html += `
                            <div class="result-item">
                                <div class="item-header">
                                    <span class="item-name">[!] ${c.cookie_name}</span>
                                    <span class="severity severity-${c.severity}">${c.severity}</span>
                                </div>
                                ${c.issues.map(issue => `<div class="description">- ${issue}</div>`).join('')}
                                ${c.recommendation ? `<div class="recommendation">[i] ${c.recommendation}</div>` : ''}
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                if (report.disclosures && report.disclosures.length > 0) {
                    html += `
                        <div class="result-section">
                            <h3>Information Disclosures</h3>
                    `;
                    report.disclosures.forEach(d => {
                        html += `
                            <div class="result-item">
                                <div class="item-header">
                                    <span class="item-name">[i] ${d.header}</span>
                                    <span class="severity severity-${d.severity}">${d.severity}</span>
                                </div>
                                <div class="description">Value: ${d.value} - ${d.description}</div>
                                ${d.recommendation ? `<div class="recommendation">[i] ${d.recommendation}</div>` : ''}
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                if (report.headers_present) {
                    html += `
                        <div class="result-section">
                            <h3>All Response Headers</h3>
                            <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; overflow-x: auto;">
                                <pre style="color: #8892b0; font-size: 0.85rem; margin: 0;">${JSON.stringify(report.headers_present, null, 2)}</pre>
                            </div>
                        </div>
                    `;
                }

                detailedResults.innerHTML = html;
                
                // Scroll to results
                results.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function displayBatchResults(data) {
                results.style.display = 'block';
                hideStatus();
                
                let html = `
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #00d4ff;">Batch Scan Results (${data.total_scanned} URLs)</h3>
                    </div>
                `;

                data.results.forEach((report, index) => {
                    html += `
                        <div style="margin-bottom: 30px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                            <h4 style="color: #00d4ff; margin-bottom: 10px;">${index+1}. ${report.target}</h4>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px;">
                                <div>Status: ${report.status_code || 'N/A'}</div>
                                <div>Missing Headers: ${report.scan_summary?.missing_headers || 0}</div>
                                <div>Risk Level: <span class="severity severity-${report.scan_summary?.risk_level || 'LOW'}">${report.scan_summary?.risk_level || 'LOW'}</span></div>
                            </div>
                            ${report.error ? `<div style="color: #ff4757;">Error: ${report.error}</div>` : ''}
                        </div>
                    `;
                });

                detailedResults.innerHTML = html;
                summaryCards.innerHTML = `<div class="summary-card"><div class="number">${data.total_scanned}</div><div class="label">URLs Scanned</div></div>`;
                
                // Scroll to results
                results.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function showLoading(show) {
                scanBtn.disabled = show;
                batchScanBtn.disabled = show;
                if (show) {
                    scanBtn.querySelector('.btn-text').textContent = 'Scanning...';
                    scanBtn.querySelector('.spinner').style.display = 'inline-block';
                } else {
                    scanBtn.querySelector('.btn-text').textContent = 'Scan Now';
                    scanBtn.querySelector('.spinner').style.display = 'none';
                }
            }

            function showStatus(message, type) {
                statusMessage.style.display = 'block';
                statusMessage.className = `status-message status-${type}`;
                statusMessage.textContent = message;
            }

            function hideStatus() {
                statusMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
